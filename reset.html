<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habboub — Reset Password</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #07090d;
      color: white;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border: 1px solid #20242c;
      border-radius: 18px;
      background: #0d1015;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo span {
      display: inline-grid;
      place-items: center;
      width: 55px;
      height: 55px;
      border-radius: 15px;
      background: white;
      color: black;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .sub {
      color: #777f8a;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: 1px solid #252a33;
      border-radius: 10px;
      background: #090c10;
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      <span>H</span>

      <h1>Reset Password</h1>

      <p class="sub">
        Create a new password for your Habboub account.
      </p>
    </div>

    <input
      id="password"
      type="password"
      placeholder="New password"
    >

    <input
      id="confirmPassword"
      type="password"
      placeholder="Confirm new password"
    >

    <button id="resetButton" onclick="changePassword()">
      Change Password
    </button>

    <div id="message"></div>

  </div>

<script>

const SUPABASE_URL =
  "https://feoyjasuvrqxzhskqzye.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_ehho8PNFtVSRiBn7GaBl9Q_Tl1mYVT0";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


async function changePassword() {

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("resetButton");


  if (!password || !confirmPassword) {

    message.textContent =
      "Please enter both passwords.";

    return;
  }


  if (password.length < 6) {

    message.textContent =
      "Password must be at least 6 characters.";

    return;
  }


  if (password !== confirmPassword) {

    message.textContent =
      "Passwords do not match.";

    return;
  }


  button.disabled = true;
  button.textContent = "Changing...";
  message.textContent = "";


  const { error } =
    await supabaseClient.auth.updateUser({
      password: password
    });


  if (error) {

    console.error(error);

    message.textContent =
      error.message;

    button.disabled = false;
    button.textContent = "Change Password";

    return;
  }


  message.textContent =
    "Password changed successfully!";


  button.textContent =
    "Success";


  setTimeout(() => {

    window.location.href =
      "index.html";

  }, 1500);

}

</script>

</body>
</html>

name: Apply ECONOVA Home V3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace home section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          home = Path('home-v3.html').read_text(encoding='utf-8').rstrip() + '\n'
          html = index.read_text(encoding='utf-8')
          if 'econova-home-v2' in html:
              print('Home V3 already applied')
              raise SystemExit(0)
          start = html.index('    <!-- HOME -->')
          end = html.index('    <!-- TRADING SESSION -->')
          html = html[:start] + '    <!-- HOME -->\n' + home + html[end:]
          marker = '<link rel="stylesheet" href="econova-home-v2.css?v=20260906">'
          if marker not in html:
              html = html.replace('<link rel="stylesheet" href="style.css">', '<link rel="stylesheet" href="style.css">\n  ' + marker, 1)
          index.write_text(html, encoding='utf-8')
          PY
      - name: Commit home redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Redesign ECONOVA home experience"; git push; fi

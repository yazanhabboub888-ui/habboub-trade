name: Apply ECONOVA performance fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage for faster first paint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          perf='econova-performance.css?v=20260906-1'
          tag=f'<link rel="stylesheet" href="{perf}">'
          if perf not in s:
              anchor='<link rel="stylesheet" href="style.css">'
              s=s.replace(anchor, anchor+tag, 1)
          import re
          pattern=r'\s*<script src="econova-public-i18n\.js\?v=20260906-4"></script>'
          matches=re.findall(pattern,s)
          s=re.sub(pattern,'',s)
          s=s.replace('</head>', '  <script src="econova-public-i18n.js?v=20260906-4"></script>\n</head>',1)
          p.write_text(s,encoding='utf-8')
          print('Removed duplicate i18n tags:', max(0,len(matches)-1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Improve ECONOVA first paint and loading [perf-fix]'
          git diff --cached --quiet || git push

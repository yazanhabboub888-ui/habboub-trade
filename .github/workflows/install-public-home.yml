name: Install ECONOVA public homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject public homepage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          index = Path('index.html')
          snippet = Path('public-home.html').read_text()
          text = index.read_text()
          if '<div id="econova-public-site"' not in text:
              marker = '    <!-- HOME -->'
              if marker not in text:
                  raise SystemExit('HOME marker not found')
              text = text.replace(marker, '    <!-- ECONOVA PUBLIC HOMEPAGE -->\n' + snippet + '\n    <!-- END ECONOVA PUBLIC HOMEPAGE -->\n\n' + marker, 1)
          if 'visitor.css?v=20260906-5' not in text:
              text = text.replace('  <link rel="stylesheet" href="style.css">', '  <link rel="stylesheet" href="style.css">\n  <link rel="stylesheet" href="visitor.css?v=20260906-5">', 1)
          text = text.replace('<body>', '<body class="econova-app-page">', 1)
          if 'scroll-behavior:smooth' not in text:
              text = text.replace('</head>', '<style>html{scroll-behavior:smooth;scroll-padding-top:90px}.econova-public-site{min-height:100vh}.econova-public-site .v-section{scroll-margin-top:90px}</style>\n</head>', 1)
          index.write_text(text)
          PY
      - name: Commit homepage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage changes needed"
            exit 0
          fi
          git commit -m "Add ECONOVA public homepage to main URL"
          git push
name: Inject Habboub News Intelligence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject script tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="news-intelligence.js"></script>'
          if tag not in text:
              marker = '<script src="script.js"></script>'
              if marker not in text:
                  raise SystemExit('script.js tag not found in index.html')
              text = text.replace(marker, marker + '\n  ' + tag, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: inject news intelligence"
          git push

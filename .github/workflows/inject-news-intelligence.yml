name: Inject Habboub UI Enhancements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore index if corrupted and inject assets
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          p = Path('index.html')
          text = p.read_text(encoding='utf-8') if p.exists() else ''

          if '<!DOCTYPE html>' not in text or '<main>' not in text or len(text) < 10000:
              subprocess.run(['git', 'checkout', '96806ffe54c563f9d0ab727cf0cf5f3389a18c08', '--', 'index.html'], check=True)
              text = p.read_text(encoding='utf-8')

          def add_after(marker, tag):
              global text
              if tag in text:
                  return
              if marker not in text:
                  raise SystemExit(f'marker not found: {marker}')
              text = text.replace(marker, marker + '\n  ' + tag, 1)

          add_after('<link rel="stylesheet" href="style.css">', '<link rel="stylesheet" href="mobile-polish.css">')
          add_after('<link rel="stylesheet" href="mobile-polish.css">', '<link rel="stylesheet" href="profile-pro.css">')
          add_after('<script src="script.js"></script>', '<script src="news-intelligence.js"></script>')
          add_after('<script src="news-intelligence.js"></script>', '<script src="news-consensus.js"></script>')
          add_after('<script src="news-consensus.js"></script>', '<script src="trading-session-market.js"></script>')
          add_after('<script src="trading-session-market.js"></script>', '<script src="session-persistence.js"></script>')

          market_live = '<script src="market-live.js?v=20260906"></script>'
          if market_live not in text:
              marker = '<script src="session-persistence.js"></script>'
              if marker not in text:
                  raise SystemExit('session persistence marker not found')
              text = text.replace(marker, marker + '\n  ' + market_live, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore index and load market feed"
          git push

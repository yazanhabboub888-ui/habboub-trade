name: Apply ECONOVA Visitor Gate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject visitor gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="visitor-gate.js"></script>'
          if marker not in s:
              anchor='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
              if anchor in s:
                  s=s.replace(anchor, anchor+'\n  '+marker, 1)
              else:
                  s=s.replace('</head>', '  '+marker+'\n</head>', 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Route visitors to public ECONOVA landing"
          git push

name: Cleanup ECONOVA Public Homepage
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate public language script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<script src="econova-public-i18n.js?v=20260906-1"></script>\n', '')
          s = s.replace('<script src="econova-public-i18n.js?v=20260906-3"></script>', '<script src="econova-public-i18n.js?v=20260906-4"></script>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "ECONOVA Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add index.html
          git commit -m "Clean up ECONOVA public homepage scripts"
          git push

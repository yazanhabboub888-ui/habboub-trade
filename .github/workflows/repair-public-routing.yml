name: Repair ECONOVA public routing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Repair static entry files
        shell: bash
        run: |
          set -e
          if [ -f index.html ]; then
            sed -i '1{/^```html[[:space:]]*$/d;}' index.html
            sed -i '${/^```[[:space:]]*$/d;}' index.html
          fi
          if [ -f visitor.html ]; then
            sed -i 's#href="index.html"#href="auth.html"#g' visitor.html
          fi
          cat > visitor-gate.js <<'EOF'
          /* ECONOVA — direct public homepage/member gate. */
          (function(){
            'use strict';
            if(window.__ECONOVA_GATE__)return;
            window.__ECONOVA_GATE__=true;
            const path=location.pathname.replace(/\/+$/,'');
            const isApp=/(^|\/)index\.html$/.test(path)||path.endsWith('/habboub-trade')||path==='';
            if(!isApp)return;
            const supabaseUrl='https://feoyjasuvrqxzhskqzye.supabase.co';
            const supabaseKey='sb_publishable_ehho8PNFtVSRiBn7GaBl9Q_Tl1mYVT0';
            const style=document.createElement('style');
            style.textContent='.topbar,#mobileNav{display:none!important}.econova-public-site{display:block!important}body.econova-member-mode .topbar{display:flex!important}body.econova-member-mode #mobileNav{display:none!important}body.econova-member-mode .econova-public-site{display:none!important}body.econova-public-mode main>.page-section{display:none!important}';
            (document.head||document.documentElement).appendChild(style);
            const site=()=>document.getElementById('econova-public-site');
            function publicMode(){document.body.classList.add('econova-public-mode');document.body.classList.remove('econova-member-mode');if(site())site().style.display='block';window.EconovaPublicI18n?.apply?.(window.EconovaPublicI18n.getLang?.()||'en');}
            function memberMode(){document.body.classList.add('econova-member-mode');document.body.classList.remove('econova-public-mode');if(site())site().style.display='none';if(!document.querySelector('script[data-econova-member-i18n]')){const s=document.createElement('script');s.src='i18n.js?v=20260906-2';s.dataset.econovaMemberI18n='1';document.head.appendChild(s);}}
            function boot(){if(!window.supabase?.createClient)return setTimeout(boot,50);try{const client=window.supabase.createClient(supabaseUrl,supabaseKey);client.auth.getSession().then(({data})=>data?.session?.user?memberMode():publicMode()).catch(publicMode);}catch(e){publicMode();}}
            boot();
          })();
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html visitor.html visitor-gate.js
          if git diff --cached --quiet; then echo "No routing repair needed."; exit 0; fi
          git commit -m "Fix ECONOVA public and member routing"
          git push

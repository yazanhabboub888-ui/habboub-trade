name: Load Journal Pro

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire-journal-pro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Wire Journal Pro assets
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old_css = '<link rel="stylesheet" href="mobile-polish.css">'
          new_css = old_css + '\n  <link rel="stylesheet" href="journal-pro.css">'
          if 'href="journal-pro.css"' not in s and old_css in s:
              s = s.replace(old_css, new_css, 1)
          script = '<script src="journal-pro.js"></script>'
          if script not in s:
              s = s.replace('</body>', '  ' + script + '\n</body>', 1)
          p.write_text(s, encoding="utf-8")
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Wire Journal Pro assets"
          git push

name: Load Journal Pro
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire-journal-pro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Wire Journal Pro assets
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          css = '<link rel="stylesheet" href="journal-pro.css">'
          if css not in s:
              s = s.replace('<link rel="stylesheet" href="mobile-polish.css">', '<link rel="stylesheet" href="mobile-polish.css">\n  '+css, 1)
          for script in ['journal-pro.js','journal-save-pro.js']:
              tag = f'<script src="{script}"></script>'
              if tag not in s:
                  s = s.replace('</body>', '  '+tag+'\n</body>', 1)
          p.write_text(s, encoding="utf-8")
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Wire journal trade capture"
          git push

name: Apply ECONOVA Tools fixes
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[tools-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='econova-tools-system-theme.css?v=20260906-1'
          tag=f'<link rel="stylesheet" href="{marker}">'
          if marker not in s:
              anchor='<link rel="stylesheet" href="econova-tools-upgrade.css?v=20260906-1">'
              if anchor in s:
                  s=s.replace(anchor, anchor+tag, 1)
              else:
                  s=s.replace('</head>', tag+'</head>', 1)
          js='econova-tools-language-fix.js?v=20260906-1'
          jtag=f'<script src="{js}"></script>'
          if js not in s:
              s=s.replace('</body>', jtag+'</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix ECONOVA Tools themes and translations [tools-fix]'
          git push
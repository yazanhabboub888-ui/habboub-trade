<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habboub Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07090d;
      color: #fff;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 240px;
      height: 100vh;
      padding: 30px 20px;
      border-right: 1px solid #1c2028;
      background: #0b0e13;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 50px;
    }

    .logo span {
      display: inline-grid;
      place-items: center;
      width: 35px;
      height: 35px;
      margin-right: 8px;
      border-radius: 10px;
      background: white;
      color: black;
    }

    .menu button {
      width: 100%;
      padding: 13px;
      margin-bottom: 8px;
      border: 0;
      border-radius: 10px;
      text-align: left;
      color: #aeb5c0;
      background: transparent;
      cursor: pointer;
    }

    .menu button:hover,
    .menu button.active {
      color: white;
      background: #181c23;
    }

    .main {
      margin-left: 240px;
      padding: 45px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
    }

    h1 {
      font-size: 32px;
    }

    .admin {
      padding: 10px 15px;
      border: 1px solid #252a33;
      border-radius: 10px;
      color: #aaa;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .card {
      padding: 25px;
      border: 1px solid #1c2028;
      border-radius: 15px;
      background: #0d1015;
    }

    .card span {
      color: #777f8a;
      font-size: 12px;
    }

    .card h2 {
      margin-top: 10px;
      font-size: 30px;
    }

    .panel {
      display: none;
      margin-top: 30px;
      padding: 30px;
      border: 1px solid #1c2028;
      border-radius: 15px;
      background: #0d1015;
    }

    .panel.active {
      display: block;
    }

    .panel h2 {
      margin-bottom: 25px;
    }

    input,
    textarea {
      width: 100%;
      margin-bottom: 15px;
      padding: 13px;
      border: 1px solid #252a33;
      border-radius: 9px;
      outline: none;
      background: #090c10;
      color: white;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .btn {
      padding: 12px 18px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: white;
      color: black;
    }

    .danger {
      background: #2a1518;
      color: #ff7c85;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #555;
    }

    .dot.live {
      background: #fff;
      box-shadow: 0 0 15px white;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
    }

    .table th,
    .table td {
      padding: 15px;
      border-bottom: 1px solid #1c2028;
      text-align: left;
    }

    .table th {
      color: #777f8a;
      font-size: 12px;
    }

    @media(max-width:900px) {

      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
      }

      .main {
        margin-left: 0;
        padding: 25px;
      }

      .cards {
        grid-template-columns: repeat(2,1fr);
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">

    <div class="logo">
      <span>H</span> Habboub
    </div>

    <div class="menu">

      <button class="active" onclick="showPanel('overview', this)">
        📊 Overview
      </button>

      <button onclick="showPanel('live', this)">
        🎥 Live
      </button>

      <button onclick="showPanel('announcements', this)">
        📢 Announcements
      </button>

      <button onclick="showPanel('courses', this)">
        🎓 Courses
      </button>

      <button onclick="showPanel('users', this)">
        👥 Users
      </button>

      <button onclick="showPanel('settings', this)">
        ⚙️ Settings
      </button>

    </div>

  </aside>


  <main class="main">

    <div class="top">

      <div>
        <span style="color:#777f8a">
          HABBOUB ADMINISTRATION
        </span>

        <h1>Dashboard</h1>
      </div>

      <div class="admin">
        👑 Administrator
      </div>

    </div>


    <!-- OVERVIEW -->

    <section id="overview" class="panel active">

      <h2>Overview</h2>

      <div class="cards">

        <div class="card">
          <span>USERS</span>
          <h2>0</h2>
        </div>

        <div class="card">
          <span>LIVE VIEWERS</span>
          <h2>0</h2>
        </div>

        <div class="card">
          <span>COURSES</span>
          <h2>0</h2>
        </div>

        <div class="card">
          <span>ANNOUNCEMENTS</span>
          <h2>0</h2>
        </div>

      </div>

    </section>


    <!-- LIVE -->

    <section id="live" class="panel">

      <h2>Live Control</h2>

      <div class="live-status">

        <div class="dot" id="liveDot"></div>

        <strong id="liveStatus">
          Offline
        </strong>

      </div>

      <input
        id="liveTitle"
        placeholder="Live title"
      >

      <textarea
        id="liveDescription"
        placeholder="Live description"
      ></textarea>

      <button
        class="btn primary"
        onclick="startLive()"
      >
        ▶ Start Live
      </button>

      <button
        class="btn danger"
        onclick="stopLive()"
      >
        ■ Stop Live
      </button>

    </section>


    <!-- ANNOUNCEMENTS -->

    <section id="announcements" class="panel">

      <h2>Create Announcement</h2>

      <input
        id="announcementTitle"
        placeholder="Announcement title"
      >

      <textarea
        id="announcementText"
        placeholder="Announcement text"
      ></textarea>

      <button
        class="btn primary"
        onclick="publishAnnouncement()"
      >
        Publish Announcement
      </button>

    </section>


    <!-- COURSES -->

    <section id="courses" class="panel">

      <h2>Add Course</h2>

      <input
        id="courseTitle"
        placeholder="Course title"
      >

      <textarea
        id="courseDescription"
        placeholder="Course description"
      ></textarea>

      <button
        class="btn primary"
        onclick="addCourse()"
      >
        Add Course
      </button>

    </section>


    <!-- USERS -->

    <section id="users" class="panel">

      <h2>Users</h2>

      <table class="table">

        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="usersTable">

          <tr>
            <td colspan="3">
              No users yet.
            </td>
          </tr>

        </tbody>

      </table>

    </section>


    <!-- SETTINGS -->

    <section id="settings" class="panel">

      <h2>Settings</h2>

      <input
        placeholder="Website name"
        value="Habboub"
      >

      <input
        placeholder="Admin email"
      >

      <button class="btn primary">
        Save Settings
      </button>

    </section>

  </main>


  <script>

    function showPanel(id, button) {

      document
        .querySelectorAll(".panel")
        .forEach(panel => {
          panel.classList.remove("active");
        });

      document
        .getElementById(id)
        .classList.add("active");

      document
        .querySelectorAll(".menu button")
        .forEach(btn => {
          btn.classList.remove("active");
        });

      button.classList.add("active");

    }


    function startLive() {

      const title =
        document.getElementById("liveTitle").value;

      if (!title) {
        alert("Enter a live title first.");
        return;
      }

      document
        .getElementById("liveDot")
        .classList.add("live");

      document
        .getElementById("liveStatus")
        .textContent =
        "LIVE — " + title;

      alert("Live session created.");

    }


    function stopLive() {

      document
        .getElementById("liveDot")
        .classList.remove("live");

      document
        .getElementById("liveStatus")
        .textContent =
        "Offline";

    }


    function publishAnnouncement() {

      const title =
        document.getElementById("announcementTitle").value;

      if (!title) {
        alert("Enter an announcement title.");
        return;
      }

      alert("Announcement published.");

      document
        .getElementById("announcementTitle")
        .value = "";

      document
        .getElementById("announcementText")
        .value = "";

    }


    function addCourse() {

      const title =
        document.getElementById("courseTitle").value;

      if (!title) {
        alert("Enter a course title.");
        return;
      }

      alert("Course added.");

      document
        .getElementById("courseTitle")
        .value = "";

      document
        .getElementById("courseDescription")
        .value = "";

    }

  </script>

</body>
</html>

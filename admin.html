<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Habboub Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07090d;
      color: white;
      min-height: 100vh;
    }

    /* ================= LOGIN ================= */

    #loginPage {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border: 1px solid #20242c;
      border-radius: 18px;
      background: #0d1015;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-logo span {
      display: inline-grid;
      place-items: center;
      width: 55px;
      height: 55px;
      border-radius: 15px;
      background: white;
      color: black;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .login-logo h1 {
      font-size: 25px;
    }

    .login-logo p {
      color: #777f8a;
      margin-top: 7px;
      font-size: 13px;
    }

    .login-box input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #252a33;
      border-radius: 10px;
      background: #090c10;
      color: white;
      outline: none;
    }

    .login-box input:focus {
      border-color: #555d68;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #loginMessage {
      margin-top: 15px;
      color: #ff8585;
      font-size: 13px;
      text-align: center;
    }

    /* ================= ADMIN ================= */

    #adminPage {
      display: none;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 240px;
      height: 100vh;
      padding: 30px 20px;
      border-right: 1px solid #1c2028;
      background: #0b0e13;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 50px;
    }

    .logo span {
      display: inline-grid;
      place-items: center;
      width: 35px;
      height: 35px;
      margin-right: 8px;
      border-radius: 10px;
      background: white;
      color: black;
    }

    .menu button {
      width: 100%;
      padding: 13px;
      margin-bottom: 8px;
      border: 0;
      border-radius: 10px;
      text-align: left;
      color: #aeb5c0;
      background: transparent;
      cursor: pointer;
    }

    .menu button:hover,
    .menu button.active {
      color: white;
      background: #181c23;
    }

    .logout {
      margin-top: 30px;
      color: #ff7777 !important;
    }

    .main {
      margin-left: 240px;
      padding: 45px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
    }

    h1 {
      font-size: 32px;
    }

    .admin {
      padding: 10px 15px;
      border: 1px solid #252a33;
      border-radius: 10px;
      color: #aaa;
    }

    .panel {
      display: none;
      padding: 30px;
      border: 1px solid #1c2028;
      border-radius: 15px;
      background: #0d1015;
    }

    .panel.active {
      display: block;
    }

    .panel h2 {
      margin-bottom: 25px;
    }

    input,
    textarea {
      width: 100%;
      margin-bottom: 15px;
      padding: 13px;
      border: 1px solid #252a33;
      border-radius: 9px;
      outline: none;
      background: #090c10;
      color: white;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .btn {
      padding: 12px 18px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
      margin-right: 8px;
    }

    .primary {
      background: white;
      color: black;
    }

    .danger {
      background: #2a1518;
      color: #ff7c85;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .card {
      padding: 25px;
      border: 1px solid #1c2028;
      border-radius: 15px;
      background: #0d1015;
    }

    .card span {
      color: #777f8a;
      font-size: 12px;
    }

    .card h2 {
      margin-top: 10px;
      font-size: 30px;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #555;
    }

    .dot.live {
      background: white;
      box-shadow: 0 0 15px white;
    }

    .item {
      padding: 18px;
      margin-top: 15px;
      border: 1px solid #1c2028;
      border-radius: 12px;
      background: #090c10;
    }

    .item h3 {
      margin-bottom: 8px;
    }

    .item p {
      color: #aaa;
      line-height: 1.6;
    }

    @media(max-width:900px) {

      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
      }

      .main {
        margin-left: 0;
        padding: 20px;
      }

      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

    }

  </style>

</head>

<body>

<!-- ================================================= -->
<!-- LOGIN PAGE -->
<!-- ================================================= -->

<div id="loginPage">

  <div class="login-box">

    <div class="login-logo">

      <span>H</span>

      <h1>Habboub Admin</h1>

      <p>Administrator Login</p>

    </div>

    <input
      id="loginEmail"
      type="email"
      value="yazanhabboub888@gmail.com"
      placeholder="Admin Email"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
    >

    <button
      id="loginButton"
      class="login-btn"
      onclick="adminLogin()"
    >
      Login
    </button>

    <div id="loginMessage"></div>

  </div>

</div>


<!-- ================================================= -->
<!-- ADMIN PAGE -->
<!-- ================================================= -->

<div id="adminPage">

  <aside class="sidebar">

    <div class="logo">
      <span>H</span> Habboub
    </div>

    <div class="menu">

      <button
        class="active"
        onclick="showPanel('overview', this)"
      >
        📊 Overview
      </button>

      <button
        onclick="showPanel('live', this)"
      >
        🎥 Live
      </button>

      <button
        onclick="showPanel('announcements', this)"
      >
        📢 Announcements
      </button>

      <button
        onclick="showPanel('courses', this)"
      >
        🎓 Courses
      </button>

      <button
        onclick="showPanel('users', this)"
      >
        👥 Users
      </button>

      <button
        class="logout"
        onclick="logoutAdmin()"
      >
        🚪 Logout
      </button>

    </div>

  </aside>


  <main class="main">

    <div class="top">

      <div>

        <span style="color:#777f8a">
          HABBOUB ADMINISTRATION
        </span>

        <h1>Dashboard</h1>

      </div>

      <div class="admin">
        👑 Administrator
      </div>

    </div>


    <!-- ================= OVERVIEW ================= -->

    <section
      id="overview"
      class="panel active"
    >

      <h2>Overview</h2>

      <div class="cards">

        <div class="card">
          <span>USERS</span>
          <h2 id="usersCount">0</h2>
        </div>

        <div class="card">
          <span>LIVE</span>
          <h2 id="liveCount">0</h2>
        </div>

        <div class="card">
          <span>COURSES</span>
          <h2 id="coursesCount">0</h2>
        </div>

        <div class="card">
          <span>ANNOUNCEMENTS</span>
          <h2 id="announcementsCount">0</h2>
        </div>

      </div>

    </section>


    <!-- ================= LIVE ================= -->

    <section
      id="live"
      class="panel"
    >

      <h2>Live Control</h2>

      <div class="live-status">

        <div
          class="dot"
          id="liveDot"
        ></div>

        <strong id="liveStatus">
          Offline
        </strong>

      </div>

      <input
        id="liveTitle"
        placeholder="Live title"
      >

      <textarea
        id="liveDescription"
        placeholder="Live description"
      ></textarea>

      <input
        id="liveStreamUrl"
        placeholder="Stream URL / Embed URL (optional)"
      >

      <button
        class="btn primary"
        onclick="startLive()"
      >
        ▶ Start Live
      </button>

      <button
        class="btn danger"
        onclick="stopLive()"
      >
        ■ Stop Live
      </button>

    </section>


    <!-- ================= ANNOUNCEMENTS ================= -->

    <section
      id="announcements"
      class="panel"
    >

      <h2>Create Announcement</h2>

      <input
        id="announcementTitle"
        placeholder="Announcement title"
      >

      <textarea
        id="announcementText"
        placeholder="Announcement text"
      ></textarea>

      <input
        id="announcementImage"
        placeholder="Image URL (optional)"
      >

      <input
        id="announcementLink"
        placeholder="Link URL (optional)"
      >

      <button
        class="btn primary"
        onclick="publishAnnouncement()"
      >
        Publish Announcement
      </button>

      <div id="announcementList"></div>

    </section>


    <!-- ================= COURSES ================= -->

    <section
      id="courses"
      class="panel"
    >

      <h2>Add Course</h2>

      <input
        id="courseTitle"
        placeholder="Course title"
      >

      <textarea
        id="courseDescription"
        placeholder="Course description"
      ></textarea>

      <input
        id="courseThumbnail"
        placeholder="Thumbnail URL (optional)"
      >

      <button
        class="btn primary"
        onclick="addCourse()"
      >
        Add Course
      </button>

      <div id="courseList"></div>

    </section>


    <!-- ================= USERS ================= -->

    <section
      id="users"
      class="panel"
    >

      <h2>Users</h2>

      <div id="usersList">
        Loading users...
      </div>

    </section>

  </main>

</div>


<script>

  /* =================================================
     SUPABASE
  ================================================= */

  const SUPABASE_URL =
    "https://feoyjasuvrqxzhskqzye.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_ehho8PNFtVSRiBn7GaBl9Q_Tl1mYVT0";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* =================================================
     LOGIN
  ================================================= */

  async function adminLogin() {

    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("loginPassword")
        .value;

    const message =
      document.getElementById(
        "loginMessage"
      );

    const button =
      document.getElementById(
        "loginButton"
      );

    if (!email || !password) {

      message.textContent =
        "Enter your email and password.";

      return;

    }

    button.disabled = true;
    button.textContent = "Logging in...";
    message.textContent = "";

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({
          email,
          password
        });

    if (error) {

      message.textContent =
        error.message;

      button.disabled = false;
      button.textContent = "Login";

      return;

    }

    const user =
      data.user;

    /* CHECK ADMIN ROLE */

    const {
      data: adminRole,
      error: adminError
    } =
      await supabaseClient
        .from("admin_roles")
        .select("role")
        .eq("user_id", user.id)
        .maybeSingle();

    if (adminError) {

      console.error(adminError);

      await supabaseClient.auth.signOut();

      message.textContent =
        "Could not verify administrator permissions.";

      button.disabled = false;
      button.textContent = "Login";

      return;

    }

    if (
      !adminRole ||
      adminRole.role !== "admin"
    ) {

      await supabaseClient.auth.signOut();

      message.textContent =
        "This account is not an administrator.";

      button.disabled = false;
      button.textContent = "Login";

      return;

    }

    /* SUCCESS */

    document
      .getElementById("loginPage")
      .style.display = "none";

    document
      .getElementById("adminPage")
      .style.display = "block";

    button.disabled = false;
    button.textContent = "Login";

    await loadDashboard();

  }


  /* =================================================
     CHECK EXISTING SESSION
  ================================================= */

  async function checkExistingSession() {

    const {
      data: {
        user
      }
    } =
      await supabaseClient.auth
        .getUser();

    if (!user) return;

    const {
      data: adminRole
    } =
      await supabaseClient
        .from("admin_roles")
        .select("role")
        .eq("user_id", user.id)
        .maybeSingle();

    if (
      adminRole &&
      adminRole.role === "admin"
    ) {

      document
        .getElementById("loginPage")
        .style.display = "none";

      document
        .getElementById("adminPage")
        .style.display = "block";

      await loadDashboard();

    }

  }


  /* =================================================
     LOGOUT
  ================================================= */

  async function logoutAdmin() {

    await supabaseClient.auth.signOut();

    location.reload();

  }


  /* =================================================
     PANELS
  ================================================= */

  function showPanel(
    id,
    button
  ) {

    document
      .querySelectorAll(".panel")
      .forEach(panel => {

        panel.classList.remove(
          "active"
        );

      });

    const panel =
      document.getElementById(id);

    if (panel) {

      panel.classList.add(
        "active"
      );

    }

    document
      .querySelectorAll(
        ".menu button"
      )
      .forEach(btn => {

        btn.classList.remove(
          "active"
        );

      });

    if (button) {

      button.classList.add(
        "active"
      );

    }

  }


  /* =================================================
     START LIVE
  ================================================= */

  async function startLive() {

    const title =
      document
        .getElementById("liveTitle")
        .value
        .trim();

    const description =
      document
        .getElementById("liveDescription")
        .value
        .trim();

    const streamUrl =
      document
        .getElementById("liveStreamUrl")
        .value
        .trim();

    if (!title) {

      alert(
        "Enter a live title first."
      );

      return;

    }

    const {
      data: {
        user
      }
    } =
      await supabaseClient.auth
        .getUser();

    if (!user) {

      alert(
        "You must be logged in."
      );

      return;

    }

    /* VERIFY ADMIN */

    const {
      data: adminRole,
      error: adminError
    } =
      await supabaseClient
        .from("admin_roles")
        .select("role")
        .eq("user_id", user.id)
        .maybeSingle();

    if (
      adminError ||
      !adminRole ||
      adminRole.role !== "admin"
    ) {

      alert(
        "This account is not an administrator."
      );

      return;

    }

    /* STOP OLD LIVE */

    const {
      error: stopError
    } =
      await supabaseClient
        .from("live_sessions")
        .update({
          is_live: false,
          ended_at:
            new Date().toISOString()
        })
        .eq(
          "is_live",
          true
        );

    if (stopError) {

      console.error(
        stopError
      );

      alert(
        "Could not stop previous live:\n" +
        stopError.message
      );

      return;

    }

    /* CREATE NEW LIVE */

    const {
      data,
      error
    } =
      await supabaseClient
        .from("live_sessions")
        .insert({

          title:
            title,

          description:
            description,

          stream_url:
            streamUrl,

          thumbnail_url:
            "",

          is_live:
            true,

          started_at:
            new Date().toISOString()

        })
        .select()
        .single();

    if (error) {

      console.error(
        "Start Live Error:",
        error
      );

      alert(
        "Could not start live:\n" +
        error.message
      );

      return;

    }

    document
      .getElementById("liveDot")
      .classList.add("live");

    document
      .getElementById("liveStatus")
      .textContent =
        "🔴 LIVE — " +
        data.title;

    alert(
      "🔴 Habboub Live started successfully!"
    );

  }


  /* =================================================
     STOP LIVE
  ================================================= */

  async function stopLive() {

    const {
      error
    } =
      await supabaseClient
        .from("live_sessions")
        .update({

          is_live: false,

          ended_at:
            new Date().toISOString()

        })
        .eq(
          "is_live",
          true
        );

    if (error) {

      alert(
        "Could not stop live:\n" +
        error.message
      );

      return;

    }

    document
      .getElementById("liveDot")
      .classList.remove("live");

    document
      .getElementById("liveStatus")
      .textContent =
        "Offline";

    alert(
      "Live stopped."
    );

  }


  /* =================================================
     ANNOUNCEMENT
  ================================================= */

  async function publishAnnouncement() {

    const title =
      document
        .getElementById(
          "announcementTitle"
        )
        .value
        .trim();

    const content =
      document
        .getElementById(
          "announcementText"
        )
        .value
        .trim();

    const image =
      document
        .getElementById(
          "announcementImage"
        )
        .value
        .trim();

    const link =
      document
        .getElementById(
          "announcementLink"
        )
        .value
        .trim();

    if (!title) {

      alert(
        "Enter announcement title."
      );

      return;

    }

    const {
      error
    } =
      await supabaseClient
        .from("announcements")
        .insert({

          title:
            title,

          content:
            content,

          image_url:
            image,

          link_url:
            link,

          is_active:
            true

        });

    if (error) {

      alert(
        "Could not publish announcement:\n" +
        error.message
      );

      return;

    }

    document
      .getElementById(
        "announcementTitle"
      )
      .value = "";

    document
      .getElementById(
        "announcementText"
      )
      .value = "";

    document
      .getElementById(
        "announcementImage"
      )
      .value = "";

    document
      .getElementById(
        "announcementLink"
      )
      .value = "";

    alert(
      "📢 Announcement published!"
    );

    loadAnnouncements();

  }


  /* =================================================
     COURSE
  ================================================= */

  async function addCourse() {

    const title =
      document
        .getElementById(
          "courseTitle"
        )
        .value
        .trim();

    const description =
      document
        .getElementById(
          "courseDescription"
        )
        .value
        .trim();

    const thumbnail =
      document
        .getElementById(
          "courseThumbnail"
        )
        .value
        .trim();

    if (!title) {

      alert(
        "Enter course title."
      );

      return;

    }

    const {
      error
    } =
      await supabaseClient
        .from("courses")
        .insert({

          title:
            title,

          description:
            description,

          thumbnail_url:
            thumbnail,

          is_published:
            true

        });

    if (error) {

      alert(
        "Could not add course:\n" +
        error.message
      );

      return;

    }

    document
      .getElementById(
        "courseTitle"
      )
      .value = "";

    document
      .getElementById(
        "courseDescription"
      )
      .value = "";

    document
      .getElementById(
        "courseThumbnail"
      )
      .value = "";

    alert(
      "🎓 Course added!"
    );

    loadCourses();

  }


  /* =================================================
     LOAD ANNOUNCEMENTS
  ================================================= */

  async function loadAnnouncements() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("announcements")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );

    if (error) {

      console.error(error);
      return;

    }

    document
      .getElementById(
        "announcementsCount"
      )
      .textContent =
        data.length;

    const list =
      document.getElementById(
        "announcementList"
      );

    list.innerHTML = "";

    data.slice(0, 10)
      .forEach(item => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "item";

        div.innerHTML = `
          <h3>${escapeHTML(item.title)}</h3>
          <p>${escapeHTML(item.content || "")}</p>
        `;

        list.appendChild(div);

      });

  }


  /* =================================================
     LOAD COURSES
  ================================================= */

  async function loadCourses() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("courses")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );

    if (error) {

      console.error(error);
      return;

    }

    document
      .getElementById(
        "coursesCount"
      )
      .textContent =
        data.length;

    const list =
      document.getElementById(
        "courseList"
      );

    list.innerHTML = "";

    data.slice(0, 10)
      .forEach(course => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "item";

        div.innerHTML = `
          <h3>${escapeHTML(course.title)}</h3>
          <p>${escapeHTML(course.description || "")}</p>
        `;

        list.appendChild(div);

      });

  }


  /* =================================================
     LOAD USERS
  ================================================= */

  async function loadUsers() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );

    if (error) {

      console.error(
        "Users error:",
        error
      );

      document
        .getElementById(
          "usersList"
        )
        .textContent =
          "Unable to load users.";

      return;

    }

    document
      .getElementById(
        "usersCount"
      )
      .textContent =
        data.length;

    const list =
      document.getElementById(
        "usersList"
      );

    list.innerHTML = "";

    if (!data.length) {

      list.textContent =
        "No users yet.";

      return;

    }

    data.forEach(user => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "item";

      div.innerHTML = `
        <h3>${escapeHTML(user.full_name || "No name")}</h3>
        <p>${escapeHTML(user.email || "")}</p>
      `;

      list.appendChild(div);

    });

  }


  /* =================================================
     LOAD DASHBOARD
  ================================================= */

  async function loadDashboard() {

    await loadAnnouncements();

    await loadCourses();

    await loadUsers();

    const {
      data: live
    } =
      await supabaseClient
        .from("live_sessions")
        .select("id")
        .eq(
          "is_live",
          true
        );

    document
      .getElementById(
        "liveCount"
      )
      .textContent =
        live
          ? live.length
          : 0;

    if (live && live.length) {

      document
        .getElementById(
          "liveDot"
        )
        ?.classList.add("live");

      document
        .getElementById(
          "liveStatus"
        )
        .textContent =
          "🔴 LIVE";

    }

  }


  /* =================================================
     ESCAPE
  ================================================= */

  function escapeHTML(value) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  /* =================================================
     START
  ================================================= */

  checkExistingSession();

</script>
